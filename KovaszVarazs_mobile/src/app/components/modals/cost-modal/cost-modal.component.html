@if (cost) {
<div
  class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 z-[9999] pointer-events-auto"
>
  <div class="p-6 bg-white rounded-lg shadow-lg w-full max-w-lg relative">
    <h2 class="text-2xl font-bold mb-4 text-center">
      {{ cost.name != "" ? "Kiadás módosítása" : "Új kiadás" }}
    </h2>
    <form class="space-y-4">
      <div>
        <label class="block font-medium text-gray-700">Tétel</label>
        <input
          type="text"
          name="name"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          [(ngModel)]="cost.name"
          required
        />
      </div>
      <div>
        <label class="block font-medium text-gray-700">Ár</label>
        <div class="flex items-center space-x-2">
          <input
            type="number"
            name="price"
            class="mt-1 block w-20 h-10 text-center rounded-md border-gray-300 shadow-sm"
            [(ngModel)]="cost.amount"
            required
          />
          <span class="text-xl text-gray-700">€</span>
        </div>
      </div>
      <div class="flex justify-end space-x-2">
        <button
          type="button"
          class="px-4 py-2 bg-gray-300 rounded-md"
          (click)="cancel()"
        >
          Mégse
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md"
          (click)="save()"
        >
          Mentés
        </button>
      </div>
    </form>
    @if (errorMessage) {
    <div class="text-red-500 font-bold text-center mt-2">
      {{ errorMessage }}
    </div>
    }
  </div>
</div>
}
