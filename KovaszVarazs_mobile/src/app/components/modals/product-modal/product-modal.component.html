@if (product) {
<div
  class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 backdrop-blur-lg z-[9999] pointer-events-auto"
>
  <div
    class="p-6 bg-white border-2 border-black rounded-lg shadow-lg w-[96%] max-w-lg absolute left-1/2 transform -translate-x-1/2 overflow-y-auto max-h-[80vh]"
    [style.top.px]="scrollY + viewportHeight / 10"
  >
    <h2 class="text-2xl font-bold mb-4 text-center">
      {{ product.id != 0 ? "Termék módosítása" : "Új termék" }}
    </h2>
    <form class="space-y-4">
      <div>
        <label class="block font-medium text-gray-700">Név</label>
        <input
          type="text"
          name="name"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          [(ngModel)]="product.name"
          (focus)="scrollIntoView($event)"
          required
        />
      </div>
      <div>
        <label class="block font-medium text-gray-700">Egységár</label>
        <div class="flex items-center space-x-2">
          <input
            type="number"
            name="price"
            class="mt-1 block w-16 h-10 text-center rounded-md border-gray-300 shadow-sm"
            [(ngModel)]="product.price"
            (focus)="scrollIntoView($event)"
            required
          />
          <span class="text-xl text-gray-700">€ /db</span>
        </div>
      </div>

      <div>
        <label class="block font-medium text-gray-700">Kategória</label>
        <select
          name="category"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          [(ngModel)]="product.category"
          required
        >
          <option value="" disabled selected>Válassz kategóriát</option>
          <option value="Kenyerek">Kenyerek</option>
          <option value="Édes kalácsok">Édes kalácsok</option>
          <option value="Sós kalácsok">Sós kalácsok</option>
          <option value="Egyéb">Egyéb</option>
        </select>
      </div>
      <div>
        <label class="block font-medium text-gray-700">Allergének</label>
        <input
          type="text"
          name="allergens"
          placeholder="pl.: glutén, tej, tojás"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          [(ngModel)]="product.allergens"
          (focus)="scrollIntoView($event)"
        />
      </div>
      <div>
        <label class="block font-medium text-gray-700">Megjegyzés</label>
        <input
          type="text"
          name="description"
          placeholder="pl.: növényi tejjel"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          [(ngModel)]="product.description"
          (focus)="scrollIntoView($event)"
        />
      </div>
      <div class="flex items-center mt-2">
        <label class="block font-medium text-gray-700 mr-2">Használatban</label>
        <input
          type="checkbox"
          name="is_used"
          [(ngModel)]="product.is_used"
          class="form-checkbox"
        />
      </div>

      <div>
        <label class="block font-medium text-gray-700">{{
          product.image_url != "" ? "Új kép" : "Kép"
        }}</label>
        <input
          type="file"
          accept="image/*"
          name="image"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          (change)="onFileSelected($event)"
          [required]="!product.image_url"
        />
      </div>
      <div class="flex justify-end space-x-2">
        <button
          type="button"
          class="px-4 py-2 bg-gray-300 rounded-md"
          (click)="cancel()"
        >
          Mégse
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-[#C68958] text-white rounded-md"
          (click)="save()"
        >
          Mentés
        </button>
      </div>
    </form>
    @if (errorMessage) {
    <div class="text-red-500 font-bold text-center mt-2">
      {{ errorMessage }}
    </div>
    }
  </div>
</div>
}
