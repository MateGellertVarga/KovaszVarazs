@if (orderSchedule) {
<div
  class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 backdrop-blur-lg z-[9999] pointer-events-auto"
>
  <div
    class="p-6 bg-white border-2 border-black rounded-lg shadow-lg w-full max-w-lg absolute left-1/2 transform -translate-x-1/2"
    [style.top.px]="scrollY + viewportHeight / 10"
  >
    <h2 class="text-2xl font-bold mb-4 text-center">
      {{
        orderSchedule.products.length > 0
          ? "Sütési nap módosítása"
          : "Új sütési nap"
      }}
    </h2>
    <form class="space-y-4">
      <div>
        <label class="block font-medium text-gray-700">Dátum</label>
        <input
          #dateInput
          type="date"
          name="available_date"
          class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300 bg-white cursor-pointer"
          [ngModel]="orderSchedule?.available_date | date : 'yyyy-MM-dd'"
          (ngModelChange)="onDateChange($event)"
          (focus)="focusDateInput()"
          (click)="focusDateInput()"
          required
        />
      </div>
      <div>
        <label class="block font-medium text-gray-700">Megjegyzés</label>
        <textarea
          name="note"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          [(ngModel)]="orderSchedule.note"
          placeholder="Opcionális"
          rows="2"
        ></textarea>
      </div>
      <div>
        <label class="block font-medium mb-1 text-gray-700">Termékek</label>
        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
          @for (product of products; track $index) {
          <div class="flex items-center justify-between border p-2 rounded-md">
            <span>{{ product.name }}</span>
            <div class="flex items-center space-x-2">
              <input
                type="number"
                name="quantity"
                class="w-12 text-center border rounded-md"
                [value]="productMaxQuantities[product.name]"
                (change)="onQuantityChange(product.name, $event)"
              />
            </div>
          </div>
          }
        </div>
      </div>
      <div class="flex justify-end space-x-2">
        <button
          type="button"
          class="px-4 py-2 bg-gray-300 rounded-md"
          (click)="cancel()"
        >
          Mégse
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md"
          (click)="save()"
        >
          Mentés
        </button>
      </div>
    </form>
    @if (errorMessage) {
    <div class="text-red-500 font-bold text-center mt-2">
      {{ errorMessage }}
    </div>
    }
  </div>
</div>
}
