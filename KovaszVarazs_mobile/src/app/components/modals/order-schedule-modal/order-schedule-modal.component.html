@if (orderSchedule) {
<div
  class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 z-[9999] pointer-events-auto"
>
  <div class="p-6 bg-white rounded-lg shadow-lg w-full max-w-lg relative">
    <h2 class="text-2xl font-bold mb-4 text-center">
      {{
        orderSchedule.products.length > 0
          ? "Sütési nap módosítása"
          : "Új sütési nap"
      }}
    </h2>
    <form class="space-y-4">
      <div>
        <label class="block font-medium text-gray-700">Név</label>
        <input
          type="date"
          name="available_date"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
          [ngModel]="orderSchedule.available_date | date : 'yyyy-MM-dd'"
          (ngModelChange)="onDateChange(orderSchedule.available_date, $event)"
          required
        />
      </div>
      <div>
        <label class="block font-medium mb-1 text-gray-700">Termékek</label>
        <div class="space-y-2">
          @for (product of products; track $index) {
          <div class="flex items-center justify-between border p-2 rounded-md">
            <span>{{ product.name }}</span>
            <div class="flex items-center space-x-2">
              <input
                type="number"
                name="quantity"
                class="w-12 text-center border rounded-md"
                [value]="productMaxQuantities[product.name]"
                (change)="onQuantityChange(product.name, $event)"
              />
            </div>
          </div>
          }
        </div>
      </div>
      <div class="flex justify-end space-x-2">
        <button
          type="button"
          class="px-4 py-2 bg-gray-300 rounded-md"
          (click)="cancel()"
        >
          Mégse
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md"
          (click)="save()"
        >
          Mentés
        </button>
      </div>
    </form>
    @if (errorMessage) {
    <div class="text-red-500 font-bold text-center mt-2">
      {{ errorMessage }}
    </div>
    }
  </div>
</div>
}
