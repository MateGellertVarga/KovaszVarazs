<div
  class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 backdrop-blur-lg z-[9999] pointer-events-auto"
>
  <div
    class="p-6 bg-white border-2 border-black rounded-lg shadow-lg w-[96%] max-w-lg absolute left-1/2 transform -translate-x-1/2 overflow-y-auto max-h-[80vh]"
    [style.top.px]="scrollY + viewportHeight / 10"
  >
    <h2 class="text-2xl font-bold mb-4 text-center">
      {{ recipe.id !== 0 ? "Recept szerkesztése" : "Új recept" }}
    </h2>

    <form class="space-y-4">
      <div>
        <label class="block font-medium text-gray-700">Recept neve</label>
        <input
          type="text"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"
          [(ngModel)]="recipe.name"
          name="name"
        />
      </div>

      <div class="pt-4 border-t border-gray-200">
        <label class="block font-bold text-gray-800">Összetevők</label>
        <div class="space-y-2">
          @for (ing of recipe.ingredients; track $index) {
          <div class="flex gap-2 items-center w-full">
            <input
              [(ngModel)]="ing.name"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Név (pl. Liszt)"
              class="flex-1 min-w-0 p-2 border rounded shadow-sm text-sm"
            />
            <div class="flex items-center space-x-1 w-24 shrink-0">
              <input
                [(ngModel)]="ing.amount"
                [ngModelOptions]="{ standalone: true }"
                type="number"
                placeholder="Menny."
                class="w-full p-2 border rounded shadow-sm text-sm text-center"
              />
              <span class="text-gray-600 text-sm">g</span>
            </div>
            <button
              type="button"
              (click)="removeIngredient($index)"
              class="p-2 bg-gray-100 hover:bg-gray-200 rounded-md shrink-0 border border-gray-200 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
              >
                <path
                  fill="red"
                  d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3-4q.425 0 .713-.288T11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17m4 0q.425 0 .713-.288T15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17"
                />
              </svg>
            </button>
          </div>
          }
          <div class="flex justify-center pt-2">
            <button
              type="button"
              (click)="addIngredient()"
              class="w-8 h-8 rounded-full bg-[#D19263] text-white flex justify-center items-center font-bold shadow-md"
            >
              <ion-icon name="add" class="text-lg"></ion-icon>
            </button>
          </div>

          <!-- <div class="mt-2 text-right font-bold text-gray-800 border-t pt-2">
            Összesen: {{ calculateTotal() }} g
          </div> -->
        </div>
      </div>

      <div class="pt-4 border-t border-gray-200">
        <label class="block font-bold text-gray-800">Kapcsolt termékek</label>
        <p class="text-xs text-gray-500 mb-2">
          1 db elkészítéséhez szükséges tészta súly (g).
        </p>
        <div class="space-y-2">
          @for (link of recipe.products; track $index) {
          <div class="flex gap-2 items-center w-full">
            <select
              [(ngModel)]="link.product_id"
              [ngModelOptions]="{ standalone: true }"
              class="flex-1 min-w-0 p-2 border rounded shadow-sm text-sm bg-white"
            >
              <option [ngValue]="null" disabled>Válassz...</option>
              @for (prod of products; track prod.id) {
              <option [ngValue]="prod.id">{{ prod.name }}</option>
              }
            </select>
            <div class="flex items-center space-x-1 w-24 shrink-0">
              <input
                [(ngModel)]="link.quantity"
                [ngModelOptions]="{ standalone: true }"
                type="number"
                placeholder="Súly"
                class="w-full p-2 border rounded shadow-sm text-sm text-center"
              />
              <span class="text-gray-600 text-sm">g</span>
            </div>
            <button
              type="button"
              (click)="removeProductLink($index)"
              class="p-2 bg-gray-100 hover:bg-gray-200 rounded-md shrink-0 border border-gray-200 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
              >
                <path
                  fill="red"
                  d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3-4q.425 0 .713-.288T11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17m4 0q.425 0 .713-.288T15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17"
                />
              </svg>
            </button>
          </div>
          }
          <div class="flex justify-center pt-2">
            <button
              type="button"
              (click)="addProductLink()"
              class="w-8 h-8 rounded-full bg-[#D19263] text-white flex justify-center items-center font-bold shadow-md"
            >
              <ion-icon name="add" class="text-lg"></ion-icon>
            </button>
          </div>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-6">
        <button
          type="button"
          class="px-4 py-2 bg-gray-300 rounded-md"
          (click)="cancel()"
        >
          Mégse
        </button>
        <button
          type="button"
          class="px-4 py-2 bg-[#C68958] text-white rounded-md"
          (click)="save()"
        >
          Mentés
        </button>
      </div>
    </form>

    @if (errorMessage) {
    <div class="text-red-600 font-bold text-center mt-4 bg-red-50 p-2 rounded">
      {{ errorMessage }}
    </div>
    }
  </div>
</div>
