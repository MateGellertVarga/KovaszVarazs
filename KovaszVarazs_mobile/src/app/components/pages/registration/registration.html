<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="font-bold text-2xl text-center text-black"
      >Kovász Varázs</ion-title
    >
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [scrollY]="false" class="relative">
  <div class="absolute inset-0 flex items-center justify-center">
    <div
      class="p-6 bg-white rounded-lg shadow-lg w-11/12 border-2 border-gray-700"
    >
      <h2 class="text-2xl font-bold mb-4 text-center">Regisztráció</h2>
      <form class="space-y-4">
        <div>
          <label class="block font-medium text-gray-700">Név</label>
          <input
            type="text"
            name="email"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
            [(ngModel)]="newUser!.name"
            required
          />
        </div>
        <div>
          <label class="block font-medium text-gray-700">Email</label>
          <input
            type="email"
            [formNoValidate]="true"
            name="email"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
            [(ngModel)]="newUser!.email"
            required
          />
        </div>
        <div>
          <label class="block font-medium text-gray-700">Telefonszám</label>
          <input
            type="text"
            name="phone_number"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
            [(ngModel)]="newUser!.phone_number"
            required
          />
        </div>
        <div>
          <label class="block font-medium text-gray-700">Jelszó</label>
          <input
            type="password"
            [formNoValidate]="true"
            name="password"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
            [(ngModel)]="newUser!.password"
            required
          />
        </div>
        <div>
          <label class="block font-medium text-gray-700">Jelszó újra</label>
          <input
            type="password"
            [formNoValidate]="true"
            name="passwordAgain"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
            [(ngModel)]="passwordAgain"
            required
          />
        </div>
        <div class="flex justify-center space-x-5">
          <button
            type="button"
            class="px-4 py-2 bg-gray-300 rounded-md"
            [routerLink]="['/tabs/login']"
          >
            Bejelentkezés
          </button>
          <button
            type="submit"
            class="px-4 py-2 bg-blue-600 text-white rounded-md"
            (click)="register()"
          >
            Regisztráció
          </button>
        </div>
      </form>
      @if (errorMessage) {
      <div class="text-red-500 font-bold text-center mt-2">
        {{ errorMessage }}
      </div>
      }
    </div>
  </div>
</ion-content>
