@if (product) {
  <app-admin-modal
    [title]="product.id != 0 ? 'Termék módosítása' : 'Új termék'"
    [isSaving]="isSaving"
    [errorMessage]="errorMessage"
    (canceled)="canceled.emit()"
    (saved)="save()"
  >
    <div class="space-y-4">
      <div>
        <label class="kv-label" for="product-name">Név</label>
        <input
          id="product-name"
          name="name"
          type="text"
          class="kv-input"
          [(ngModel)]="product.name"
        />
      </div>
      <div>
        <label class="kv-label" for="product-price">Egységár</label>
        <div class="flex items-center gap-2">
          <input
            id="product-price"
            name="price"
            type="number"
            min="0"
            step="0.01"
            class="kv-input kv-no-spin w-28 text-center"
            [(ngModel)]="product.price"
          />
          <span class="text-lg text-gray-700">€ /db</span>
        </div>
      </div>
      <div>
        <label class="kv-label" for="product-category">Kategória</label>
        <select
          id="product-category"
          name="category"
          class="kv-input cursor-pointer"
          [(ngModel)]="product.category"
        >
          <option value="" disabled>Válassz kategóriát</option>
          @for (category of categories; track category) {
            <option [value]="category">{{ category }}</option>
          }
        </select>
      </div>
      <div>
        <label class="kv-label" for="product-allergens">Allergének</label>
        <input
          id="product-allergens"
          name="allergens"
          type="text"
          placeholder="pl.: glutén, tej, tojás"
          class="kv-input"
          [(ngModel)]="product.allergens"
        />
      </div>
      <div>
        <label class="kv-label" for="product-description">Megjegyzés</label>
        <input
          id="product-description"
          name="description"
          type="text"
          placeholder="pl.: növényi tejjel"
          class="kv-input"
          [(ngModel)]="product.description"
        />
      </div>
      <label class="flex w-fit cursor-pointer items-center gap-2">
        <span class="font-medium text-gray-700">Használatban</span>
        <input
          name="is_used"
          type="checkbox"
          class="kv-checkbox"
          [(ngModel)]="product.is_used"
        />
      </label>

      <div>
        <label class="kv-label" for="product-image">{{
          product.image_url ? "Új kép" : "Kép"
        }}</label>
        <div class="flex items-center gap-4">
          @if (product.image_url) {
            <img
              [src]="product.image_url"
              [alt]="product.name"
              class="h-24 w-auto shrink-0 rounded-xl object-cover shadow"
            />
          }
          <input
            id="product-image"
            name="image"
            type="file"
            accept="image/*"
            class="block w-full min-w-0 text-sm text-gray-700 file:mr-4 file:cursor-pointer file:rounded-full file:border-0 file:bg-[#c68958] file:px-4 file:py-2 file:font-semibold file:text-white hover:file:bg-[#a96e34]"
            (change)="onFileSelected($event)"
          />
        </div>
      </div>

      <div class="mt-2 border-t border-gray-200 pt-4">
        <h3 class="mb-2 font-bold text-gray-800">Recept összekötés</h3>
        <div class="space-y-3">
          <div>
            <label class="kv-label" for="product-recipe"
              >Recept kiválasztása</label
            >
            <select
              id="product-recipe"
              name="recipe_id"
              class="kv-input cursor-pointer"
              [(ngModel)]="product.recipe_id"
            >
              <option [ngValue]="undefined">Nincs recept</option>
              @for (recipe of recipes; track recipe.id) {
                <option [ngValue]="recipe.id">{{ recipe.name }}</option>
              }
            </select>
          </div>

          @if (product.recipe_id) {
            <div>
              <label class="kv-label" for="product-dough-weight"
                >Tészta súly (g / db)</label
              >
              <input
                id="product-dough-weight"
                name="dough_weight"
                type="number"
                min="0"
                placeholder="pl. 100"
                class="kv-input"
                [(ngModel)]="product.dough_weight"
              />
            </div>
          }
        </div>
      </div>
    </div>
  </app-admin-modal>
}
