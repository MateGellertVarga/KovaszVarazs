<div role="dialog" aria-modal="true" class="fixed inset-0 z-[1000]">
  <div class="fixed inset-0 bg-black/60"></div>
  <div class="relative flex h-full items-center justify-center p-2 sm:p-4">
    <div
      class="relative flex max-h-full w-full flex-col overflow-hidden rounded-3xl bg-white shadow-xl sm:max-h-[92vh]"
      [class.max-w-xl]="size === 'md'"
      [class.max-w-2xl]="size === 'lg'"
    >
      <div
        class="flex-shrink-0 border-b border-gray-100 px-6 pt-5 pb-3 text-center"
      >
        <h2 class="text-xl font-bold text-[#c68958] sm:text-2xl">
          {{ title }}
        </h2>
      </div>

      <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-6">
        @if (isLoading) {
          <div class="flex w-full items-center justify-center py-6">
            <img src="loading.gif" alt="Betöltés..." />
          </div>
        } @else {
          <form (ngSubmit)="save()" autocomplete="off">
            <ng-content></ng-content>
            <button type="submit" class="hidden" aria-hidden="true"></button>
          </form>
        }
      </div>

      @if (errorMessage) {
        <div
          class="mx-4 mb-3 flex-shrink-0 rounded-lg bg-red-100 px-3 py-1.5 text-center text-sm font-semibold whitespace-pre-line text-red-700 shadow sm:mx-6"
        >
          {{ errorMessage }}
        </div>
      }

      <div
        class="flex flex-shrink-0 justify-end gap-3 border-t border-gray-100 bg-gray-50 px-4 py-3 sm:px-6"
      >
        <button
          type="button"
          class="rounded-full border border-gray-300 bg-white px-5 py-2 font-semibold text-gray-700 shadow-sm transition hover:bg-gray-100 disabled:opacity-50"
          [disabled]="isSaving"
          (click)="cancel()"
        >
          Mégse
        </button>
        <button
          type="button"
          class="rounded-full bg-[#c68958] px-6 py-2 font-semibold text-white shadow transition hover:bg-[#a96e34] disabled:opacity-50"
          [disabled]="isSaving || isLoading"
          (click)="save()"
        >
          Mentés
        </button>
      </div>
    </div>
  </div>
</div>
