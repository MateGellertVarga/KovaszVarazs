<app-admin-modal
  size="lg"
  [title]="recipe.id !== 0 ? 'Recept szerkesztése' : 'Új recept'"
  [isSaving]="isSaving"
  [errorMessage]="errorMessage"
  (canceled)="canceled.emit()"
  (saved)="save()"
>
  <div class="space-y-4">
    <div>
      <label class="kv-label" for="recipe-name">Recept neve</label>
      <input
        id="recipe-name"
        name="name"
        type="text"
        class="kv-input"
        [(ngModel)]="recipe.name"
      />
    </div>

    <div class="border-t border-gray-200 pt-4">
      <span class="mb-2 block font-bold text-gray-800">Összetevők</span>
      <div class="space-y-2">
        @for (ing of recipe.ingredients; track $index) {
          <div class="flex w-full items-center gap-2">
            <input
              type="text"
              placeholder="Név (pl. Liszt)"
              class="kv-input min-w-0 flex-1 py-1.5 text-sm"
              [name]="'ingredient_name_' + $index"
              [attr.aria-label]="'Összetevő ' + ($index + 1) + ' neve'"
              [(ngModel)]="ing.name"
            />
            <div class="flex w-28 shrink-0 items-center gap-1">
              <input
                type="number"
                min="0"
                placeholder="Menny."
                class="kv-input kv-no-spin px-2 py-1.5 text-center text-sm"
                [name]="'ingredient_amount_' + $index"
                [attr.aria-label]="'Összetevő ' + ($index + 1) + ' mennyisége'"
                [(ngModel)]="ing.amount"
              />
              <span class="text-sm text-gray-600">g</span>
            </div>
            <button
              type="button"
              class="flex size-9 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-700 transition hover:bg-red-200"
              aria-label="Összetevő törlése"
              (click)="removeIngredient($index)"
            >
              <span class="pi pi-trash text-sm!"></span>
            </button>
          </div>
        }
        <div class="flex justify-center pt-2">
          <button
            type="button"
            class="flex size-9 items-center justify-center rounded-full bg-[#c68958] text-white shadow-md transition hover:bg-[#a96e34]"
            aria-label="Összetevő hozzáadása"
            title="Összetevő hozzáadása"
            (click)="addIngredient()"
          >
            <span class="pi pi-plus"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="border-t border-gray-200 pt-4">
      <span class="block font-bold text-gray-800">Kapcsolt termékek</span>
      <p class="mb-2 text-xs text-gray-500">
        1 db elkészítéséhez szükséges tészta súly (g).
      </p>
      <div class="space-y-2">
        @for (link of recipe.products; track $index) {
          <div class="flex w-full items-center gap-2">
            <select
              class="kv-input min-w-0 flex-1 cursor-pointer py-1.5 text-sm"
              [name]="'product_link_' + $index"
              [attr.aria-label]="'Kapcsolt termék ' + ($index + 1)"
              [(ngModel)]="link.product_id"
            >
              <option [ngValue]="null" disabled>Válassz...</option>
              @for (prod of products; track prod.id) {
                <option [ngValue]="prod.id">{{ prod.name }}</option>
              }
            </select>
            <div class="flex w-28 shrink-0 items-center gap-1">
              <input
                type="number"
                min="0"
                placeholder="Súly"
                class="kv-input kv-no-spin px-2 py-1.5 text-center text-sm"
                [name]="'product_weight_' + $index"
                [attr.aria-label]="'Kapcsolt termék ' + ($index + 1) + ' súlya'"
                [(ngModel)]="link.quantity"
              />
              <span class="text-sm text-gray-600">g</span>
            </div>
            <button
              type="button"
              class="flex size-9 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-700 transition hover:bg-red-200"
              aria-label="Kapcsolt termék törlése"
              (click)="removeProductLink($index)"
            >
              <span class="pi pi-trash text-sm!"></span>
            </button>
          </div>
        }
        <div class="flex justify-center pt-2">
          <button
            type="button"
            class="flex size-9 items-center justify-center rounded-full bg-[#c68958] text-white shadow-md transition hover:bg-[#a96e34]"
            aria-label="Kapcsolt termék hozzáadása"
            title="Kapcsolt termék hozzáadása"
            (click)="addProductLink()"
          >
            <span class="pi pi-plus"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</app-admin-modal>
