@if (confirmService.request; as request) {
  <div
    role="alertdialog"
    aria-modal="true"
    class="fixed inset-0 z-[1100] overflow-y-auto"
  >
    <div
      class="fixed inset-0 bg-black/60"
      (click)="confirmService.close(false)"
    ></div>
    <div
      class="pointer-events-none relative flex min-h-full items-center justify-center p-4 text-center sm:p-0"
    >
      <div
        class="pointer-events-auto relative overflow-hidden rounded-lg bg-white text-left shadow-xl outline outline-gray-200 sm:my-8 sm:w-full sm:max-w-lg"
      >
        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <div class="sm:flex sm:items-start">
            @if (request.tone === "primary") {
              <div
                class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-[#f8eada] sm:mx-0 sm:size-10"
              >
                <span class="pi pi-question-circle text-xl! text-[#c68958]"></span>
              </div>
            } @else {
              <div
                class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:size-10"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  aria-hidden="true"
                  class="size-6 text-red-600"
                >
                  <path
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            }
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
              <h3 class="text-base font-semibold text-black">
                {{ request.title }}
              </h3>
              <div class="mt-2">
                <p class="text-sm text-black">{{ request.message }}</p>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
          <button
            type="button"
            class="inline-flex w-full justify-center rounded-md px-3 py-2 text-sm font-semibold text-white sm:ml-3 sm:w-auto"
            [class]="
              request.tone === 'primary'
                ? 'bg-[#c68958] hover:bg-[#a96e34]'
                : 'bg-red-600 hover:bg-red-500'
            "
            (click)="confirmService.close(true)"
          >
            {{ request.confirmLabel }}
          </button>
          <button
            type="button"
            class="mt-3 inline-flex w-full justify-center rounded-md px-3 py-2 text-sm font-semibold sm:mt-0 sm:w-auto"
            [class]="
              request.tone === 'primary'
                ? 'bg-gray-200 text-gray-800 hover:bg-gray-300'
                : 'bg-[#c68958] text-white hover:bg-[#b67948]'
            "
            (click)="confirmService.close(false)"
          >
            {{ request.cancelLabel ?? "Mégse" }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
