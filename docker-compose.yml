services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: kovasz_backend_app
        working_dir: /var/www/html
        stdin_open: true
        tty: true
        volumes:
            - ./:/var/www/html
            - vendor_data:/var/www/html/vendor
        ports:
            - "8000:8000"
        env_file:
            - ./docker/local.env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        command: ["sh", "/var/www/html/docker/start-local.sh"]

    db:
        image: postgres:16-alpine
        container_name: kovasz_backend_db
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: kovaszvarazs_local
            POSTGRES_USER: kovasz
            POSTGRES_PASSWORD: kovasz
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U kovasz -d kovaszvarazs_local"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        container_name: kovasz_backend_redis
        restart: unless-stopped
        ports:
            - "6379:6379"

volumes:
    pg_data:
    vendor_data:
